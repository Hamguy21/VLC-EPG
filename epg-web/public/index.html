<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLC EPG — TV Guide</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161a21; --panel2:#1d222b; --border:#2a313d;
    --text:#e6e9ef; --muted:#8b93a3; --accent:#5673f5; --accent2:#6b8aff;
    --now:#ff4d5e; --grid:#232a35; --star:#f5c542;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100vh; }

  /* header */
  .top { display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .top h1 { font-size:16px; margin:0 8px 0 0; font-weight:650; letter-spacing:.2px; }
  .top h1 .sub { font-size:11px; color:var(--muted); font-weight:500; margin-left:6px; }
  .field { display:flex; flex-direction:column; gap:2px; }
  .field label { font-size:10px; text-transform:uppercase; color:var(--muted); letter-spacing:.6px; }
  .field input, .field select { background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:6px; font-size:13px; }
  .field input:focus, .field select:focus { outline:none; border-color:var(--accent); }
  .field input { width:300px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:8px 14px;
    border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--accent2); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.small { padding:4px 9px; font-size:11.5px; }
  .status { margin-left:auto; color:var(--muted); font-size:12px; max-width:320px; }
  .status.ok { color:#5fd48a; }
  .status.err { color:var(--now); }

  /* toolbar */
  .bar { display:flex; align-items:center; gap:10px; padding:6px 16px;
    background:var(--panel2); border-bottom:1px solid var(--border); font-size:12px; flex-wrap:wrap; }
  .bar .grp { color:var(--muted); margin-right:4px; }
  .bar select, .bar input { background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:4px 8px; font-size:12px; }
  .bar input[type=text] { width:190px; }
  .bar .hint { color:var(--muted); margin-left:auto; }

  /* jump-to-channel autocomplete */
  .jumpwrap { position:relative; }
  .jumpwrap input { width:200px; }
  .jump-results { position:absolute; top:100%; left:0; margin-top:2px; min-width:240px;
    max-height:320px; overflow:auto; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; z-index:70; box-shadow:0 8px 24px rgba(0,0,0,.5); display:none; }
  .jump-results.open { display:block; }
  .jump-results .jr { padding:7px 10px; cursor:pointer; font-size:12.5px;
    border-bottom:1px solid var(--grid); }
  .jump-results .jr:hover, .jump-results .jr.active { background:var(--accent); color:#fff; }
  .jump-results .jr .g { font-size:10px; color:var(--muted); margin-left:6px; }
  .jump-results .jr:hover .g { color:#dde3ff; }
  .jump-results .jr-none { padding:8px 10px; color:var(--muted); font-size:12px; }

  /* now playing bar */
  .nowbar { display:flex; align-items:center; gap:10px; padding:6px 16px;
    background:linear-gradient(90deg, #1a2030, #202738); border-bottom:1px solid var(--border);
    font-size:13px; }
  .nowbar .pulse { width:10px; height:10px; border-radius:50%; background:var(--now);
    box-shadow:0 0 0 0 rgba(255,77,94,.6); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,77,94,.6)} 70%{box-shadow:0 0 0 8px rgba(255,77,94,0)} 100%{box-shadow:0 0 0 0 rgba(255,77,94,0)} }
  .nowbar .nb-ch { font-weight:650; }
  .nowbar .nb-prog { color:var(--text); }
  .nowbar .nb-time { color:var(--muted); margin-left:auto; }

  /* grid stage */
  .stage { flex:1; overflow:auto; position:relative; background:var(--bg); }
  .grid { position:relative; }

  .ruler { position:sticky; top:0; z-index:20; height:34px; background:var(--panel);
    border-bottom:1px solid var(--border); }
  .ruler .tick { position:absolute; top:0; bottom:0; border-left:1px solid var(--grid);
    font-size:10px; color:var(--muted); padding:2px 4px; white-space:nowrap; }

  .row { position:relative; height:72px; border-bottom:1px solid var(--grid); cursor:pointer;
    content-visibility:auto; contain-intrinsic-size:auto 72px; }
  .row:hover { background:rgba(86,115,245,.06); }
  .row.playing { box-shadow:inset 3px 0 0 var(--accent); }
  .row.selected { background:rgba(86,115,245,.10); }
  .row.selected .ch { background:#1e2636; }
  .row.selected .ch .name { color:var(--accent2); }
  .row.selected::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); z-index:12; }
  .row.selected .ch .nowprog { color:var(--accent2); }
  .row .ch { position:sticky; left:0; z-index:10; width:240px; height:72px;
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; align-items:center; gap:8px; padding:6px 8px; }
  .row .ch img { width:30px; height:30px; object-fit:contain; border-radius:6px; background:#000; }
  .row .ch .cinfo { min-width:0; flex:1; }
  .row .ch .name { font-size:12.5px; font-weight:600; line-height:1.15;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .row .ch .nowprog { font-size:10.5px; color:var(--accent2); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .row .ch .nowprog .t { color:var(--muted); }
  .row .ch .group { font-size:9.5px; color:var(--muted); }
  .row .ch .star { cursor:pointer; font-size:18px; color:var(--muted); user-select:none;
    background:none; border:none; padding:0 2px; line-height:1; }
  .row .ch .star.on { color:var(--star); }

  .prog { position:absolute; top:5px; bottom:5px; background:var(--panel2);
    border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:6px; padding:6px 9px; overflow:hidden; cursor:pointer;
    transition:background .12s, border-color .12s; }
  .prog:hover { background:#262d3a; border-color:var(--accent2); }
  .prog.now { border-left-color:var(--now); }
  .prog .t { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .prog .tt { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .prog .d { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-top:2px; }
  .prog.noinfo { border-style:dashed; border-left:3px dashed var(--muted);
    background:transparent; color:var(--muted); display:flex; align-items:center;
    justify-content:center; text-align:center; font-size:12px; padding:4px 12px;
    white-space:normal; overflow:visible; }

  .nowline { position:absolute; top:0; bottom:0; width:2px; background:var(--now);
    z-index:5; pointer-events:none; }
  .nowline::after { content:""; position:absolute; top:0; left:-4px;
    border:5px solid transparent; border-top:7px solid var(--now); }

  .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:70%; color:var(--muted); gap:8px; }
  .placeholder .big { font-size:18px; }

  .loading { position:absolute; inset:0; background:rgba(15,17,21,.7); display:flex;
    align-items:center; justify-content:center; font-size:15px; z-index:50; }
  .spin { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* bottom details drawer */
  .details { position:fixed; left:0; right:0; bottom:0; z-index:80;
    background:var(--panel); border-top:1px solid var(--border);
    padding:12px 20px 16px; box-shadow:0 -8px 30px rgba(0,0,0,.55);
    transform:translateY(105%); transition:transform .28s ease;
    max-height:46vh; overflow:auto; }
  .details.open { transform:translateY(0); }
  .details .d-head { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .details .d-title { font-size:16px; font-weight:650; flex:1; margin:0; }
  .details .d-close { background:none; border:none; color:var(--muted); font-size:20px;
    cursor:pointer; line-height:1; padding:2px 6px; border-radius:6px; }
  .details .d-close:hover { background:var(--panel2); color:var(--text); }
  .details .d-body { display:flex; gap:20px; flex-wrap:wrap; }
  .details .d-main { flex:2 1 360px; min-width:280px; }
  .details .d-side { flex:1 1 300px; min-width:260px; }
  /* When the side panel has no content, let the description span full width. */
  .details .d-body:has(.d-list:empty) .d-side { display:none; }
  .details .d-body:has(.d-list:empty) .d-main { flex:1 1 100%; }
  .details .d-sub { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .details .d-time { font-size:12px; color:var(--accent2); margin-bottom:6px; }
  .details .d-desc { font-size:13.5px; line-height:1.5; color:var(--text); max-height:160px; overflow:auto; }
  .details .d-meta { display:grid; grid-template-columns:auto 1fr; gap:2px 16px;
    margin-top:10px; padding-top:8px; border-top:1px solid var(--border); }
  .details .dm-k { font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--muted); white-space:nowrap; }
  .details .dm-v { font-size:12.5px; color:var(--text); }
  .details .d-icon { margin-bottom:10px; }
  .details .d-icon img { width:20em; max-height:180px; object-fit:cover; border-radius:8px;
    border:1px solid var(--border); display:block; background:#000; }
  .details .d-icon img.hidden { display:none; }
  .details .d-list { border-top:1px solid var(--border); padding-top:8px; margin-top:8px; }
  .details .dl-head { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:6px; }
  .details .dl-item { display:flex; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer;
    font-size:12.5px; align-items:baseline; }
  .details .dl-item:hover { background:rgba(86,115,245,.12); }
  .details .dl-time { color:var(--muted); font-size:11px; min-width:44px; }
  .details .d-row { display:flex; gap:8px; margin-top:12px; }
  .details .d-row .btn { flex:1; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#222a38; border:1px solid var(--border); padding:10px 18px; border-radius:8px;
    font-size:13px; z-index:100; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }

  /* TV mode: bigger text/hit areas for viewing at a distance */
  body.tv .row { height:96px; contain-intrinsic-size:auto 96px; }
  body.tv .row .ch { width:300px; height:96px; }
  body.tv .row .ch .name { font-size:16px; }
  body.tv .row .ch .nowprog { font-size:13px; }
  body.tv .row .ch .group { font-size:12px; }
  body.tv .row .ch { font-size:22px; }
  body.tv .prog .tt { font-size:15px; }
  body.tv .prog .t { font-size:13px; }
  body.tv .ruler { height:42px; }
  body.tv .ruler .tick { font-size:13px; }
  body.tv .details { font-size:15px; }
  body.tv .details .d-title { font-size:20px; }
  body.tv .details .d-desc { font-size:15px; }
  body.tv .details .dm-k { font-size:13px; }
  body.tv .details .dm-v { font-size:15px; }
  body.tv .details .d-list .dl-item { font-size:15px; }
  body.tv .btn { font-size:15px; padding:10px 16px; }

  /* settings modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:90;
    display:none; align-items:center; justify-content:center; }
  .overlay.open { display:flex; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px;
    width:420px; max-width:92%; padding:18px 20px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .panel h2 { margin:0 0 4px; font-size:16px; }
  .panel .p-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .panel .p-row { margin-bottom:14px; }
  .panel .p-lbl { font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); display:block; margin-bottom:6px; }
  .panel .fmt-opts { display:flex; gap:8px; flex-wrap:wrap; }
  .panel .fmt-opt { display:flex; align-items:center; gap:6px; border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  .panel .fmt-opt.sel { border-color:var(--accent); background:rgba(86,115,245,.12); }
  .panel .fmt-opt input { accent-color:var(--accent); }
  .panel .p-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>▦ VLC EPG<span class="sub">TV guide</span></h1>
    <div class="field"><label>M3U playlist</label>
      <input id="m3u" placeholder="https://iptv-org.github.io/iptv/index.m3u"></div>
    <div class="field"><label>XMLTV EPG</label>
      <input id="xmltv" placeholder="https://…/epg.xml (empty → auto-find in playlist header)"></div>
    <button class="btn" id="load">Load guide</button>
    <button class="btn ghost" id="sample">Sample</button>
    <button class="btn ghost" id="grab" title="Auto-fetch matching EPG guides for these channels">⚡ Auto EPG</button>
    <button class="btn ghost" id="saveSrc" title="Save the current playlist/EPG as a named source">+ Save</button>
    <button class="btn ghost" id="settingsBtn" title="Settings">⚙</button>
    <div class="field"><label>Saved sources (Ctrl-click to select several)</label>
      <select id="saved" multiple size="6"><option value="">— none —</option></select></div>
    <button class="btn ghost small" id="loadSaved" title="Load selected source">Load</button>
    <button class="btn ghost small" id="delSaved" title="Delete selected source">Delete</button>
    <button class="btn ghost small" id="editSaved" title="Edit selected source name">Rename</button>
    <div class="status" id="status">Enter a playlist + EPG, or load the sample.</div>
  </div>

  <div class="nowbar" id="nowbar" style="display:none">
    <span class="pulse"></span>
    <span class="nb-ch" id="nbCh"></span>
    <span class="nb-prog" id="nbProg">▶</span>
    <span class="nb-time" id="nbTime"></span>
  </div>

  <div class="bar">
    <span class="grp">Group:</span><select id="group"><option value="">All channels</option></select>
    <span class="grp">Filter:</span>
    <select id="filter">
      <option value="all" selected>All</option>
      <option value="fav">Favorites</option>
      <option value="epg">With EPG</option>
    </select>
    <span class="grp">Search:</span><input type="text" id="q" placeholder="channel or program…">
    <span class="grp">Window:</span>
    <select id="window">
      <option value="2">±2 h</option><option value="3" selected>±3 h</option>
      <option value="6">±6 h</option><option value="12">±12 h</option>
    </select>
    <span class="grp">Channel:</span>
    <span class="jumpwrap">
      <input type="text" id="chJump" placeholder="Jump to channel…" autocomplete="off">
      <div class="jump-results" id="chJumpResults"></div>
    </span>
    <span class="hint">click a channel or program to watch · ★ = favorite</span>
  </div>

  <div class="stage" id="stage">
    <div class="placeholder"><div class="big">📺</div>
      <div>EPG grid appears here</div></div>
  </div>
</div>

<div class="details" id="details">
  <div class="d-head">
    <div class="d-title" id="dTitle"></div>
    <button class="d-close" id="dClose" title="Close">×</button>
  </div>
  <div class="d-body">
    <div class="d-main">
      <div class="d-icon" id="dIcon" style="display:none"><img id="dIconImg" alt="" class="hidden"></div>
      <div class="d-sub" id="dSub"></div>
      <div class="d-time" id="dTime"></div>
      <div class="d-desc" id="dDesc"></div>
      <div class="d-meta" id="dMeta"></div>
    </div>
    <div class="d-side">
      <div class="d-list" id="dList"></div>
    </div>
  </div>
  <div class="d-row">
    <button class="btn" id="dPlay">▶ Play</button>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Settings</h2>
    <div class="p-sub">Display preferences</div>
    <div class="p-row">
      <span class="p-lbl">Date format</span>
      <div class="fmt-opts" id="fmtOpts">
        <label class="fmt-opt"><input type="radio" name="dfmt" value="DMY"> D / M / Y</label>
        <label class="fmt-opt"><input type="radio" name="dfmt" value="YMD"> Y / M / D</label>
        <label class="fmt-opt"><input type="radio" name="dfmt" value="MDY"> M / D / Y</label>
      </div>
    </div>
    <div class="p-row">
      <label class="fmt-opt" style="display:inline-flex;gap:8px">
        <input type="checkbox" id="tvMode"> TV mode (bigger UI for remote / distance)
      </label>
    </div>
    <div class="p-actions">
      <button class="btn ghost" id="settClose">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
const state = { channels: [], groups: [], now: Date.now(), fav: new Set(), current: null, dfmt: 'DMY', sel: null, view: [] };
let timer = null;
const LS_SOURCES = 'vlcEpgSources';
const LS_FAV = 'vlcEpgFavorites';
const LS_DFMT = 'vlcEpgDateFormat';
const LS_TV = 'vlcEpgTvMode';

function loadFav() { try { state.fav = new Set(JSON.parse(localStorage.getItem(LS_FAV) || '[]')); } catch (_) {} }
function saveFav() { localStorage.setItem(LS_FAV, JSON.stringify([...state.fav])); }

function loadDfmt() { try { const v = localStorage.getItem(LS_DFMT); if (v === 'YMD' || v === 'MDY') state.dfmt = v; } catch (_) {} }
function saveDfmt() { localStorage.setItem(LS_DFMT, state.dfmt); }

function loadTv() { try { if (localStorage.getItem(LS_TV) === '1') document.body.classList.add('tv'); } catch (_) {} }
function applyTv(on) { document.body.classList.toggle('tv', on); localStorage.setItem(LS_TV, on ? '1' : '0'); }

function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.background = isErr ? '#3a2226' : '#222a38';
  setTimeout(() => t.classList.remove('show'), 3200);
}
async function post(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function setStatus(text, kind) {
  const s = $('status'); s.textContent = text; s.className = 'status ' + (kind || '');
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function fmtDate(ms) {
  const d = new Date(ms);
  const Y = d.getFullYear(), M = (d.getMonth()+1).toString().padStart(2,'0'), D = d.getDate().toString().padStart(2,'0');
  if (state.dfmt === 'YMD') return `${Y}/${M}/${D}`;
  if (state.dfmt === 'MDY') return `${M}/${D}/${Y}`;
  return `${D}/${M}/${Y}`;
}
// Normalize an XMLTV <date> value into a human-readable year string.
function fmtYear(v) {
  const s = String(v || '').trim();
  if (/^\d{8}$/.test(s)) return s.slice(0, 4);          // 20261105 -> 2026
  if (/^\d{4}$/.test(s)) return s;                       // 2026 -> 2026
  if (/^\d{4}-\d{2}/.test(s)) return s.slice(0, 4);      // 2026-11-05 -> 2026
  return s;
}
function fmtDateTime(ms) { return fmtDate(ms) + ' ' + fmtTime(ms); }
function nowProgram(ch, at) {
  for (const p of (ch.programs || [])) {
    if (p.start <= at && p.stop > at) return p;
    if (p.start > at) break;
  }
  return null;
}

/* ---------- sources (add / load / rename / delete) ---------- */
function savedSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || '[]'); } catch (_) { return []; } }
function writeSources(list) { localStorage.setItem(LS_SOURCES, JSON.stringify(list)); }
function selectedSources() {
  const sel = [...$('saved').selectedOptions].map(o => o.value).filter(Boolean);
  const all = savedSources();
  return sel.map(name => all.find(s => s.name === name)).filter(Boolean);
}
function refreshSavedDropdown(selectedName) {
  const dd = $('saved'); const list = savedSources();
  dd.innerHTML = '<option value="">— none —</option>' + list.map(s =>
    `<option ${s.name === selectedName ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
}
// Save current playlist/EPG as a named source (add or overwrite)
$('saveSrc').addEventListener('click', () => {
  const m3u = $('m3u').value.trim();
  const xmltv = $('xmltv').value.trim();
  if (!m3u) { toast('Enter a playlist first', true); return; }
  let name = prompt('Name this saved source:', '');
  if (!name) return;
  name = name.trim();
  if (!name) return;
  const list = savedSources();
  const existing = list.findIndex(s => s.name === name);
  if (existing >= 0) {
    if (!confirm('A source named "' + name + '" already exists. Overwrite it?')) return;
    list[existing] = { name, m3u, xmltv };
  } else {
    list.push({ name, m3u, xmltv });
  }
  writeSources(list);
  refreshSavedDropdown(name);
  toast('Saved: ' + name);
});
// Load the selected source(s) — merge multiple into one grid
$('loadSaved').addEventListener('click', async () => {
  const sel = selectedSources();
  if (!sel.length) { toast('Select a saved source first', true); return; }
  if (sel.length === 1) {
    const s = sel[0];
    $('m3u').value = s.m3u;
    $('xmltv').value = s.xmltv || '';
    await loadGuide();
    return;
  }
  // merge multiple playlists
  setStatus('Loading ' + sel.length + ' playlists…'); showLoading(true);
  try {
    let allCh = []; const groups = new Set();
    for (const s of sel) {
      const m = await post('/parse/m3u', { src: s.m3u });
      for (const c of m.channels) {
        if (!allCh.some(x => x.url === c.url)) allCh.push(c);
      }
      (m.groupList || []).forEach(g => groups.add(g));
    }
    // merge EPG for whichever selected sources carry one
    let withEpg = 0;
    for (const s of sel) {
      if (!s.xmltv) continue;
      try {
        const match = await post('/match', { m3u: s.m3u, xmltv: s.xmltv });
        const byUrl = new Map(match.channels.map(c => [c.url, c]));
        allCh = allCh.map(c => byUrl.has(c.url) ? { ...byUrl.get(c.url), url: c.url } : c);
        withEpg += match.matched;
      } catch (_) {}
    }
    state.channels = allCh.map((c, i) => ({ ...c, _src: i }));
    state.groups = [...groups];
    $('m3u').value = sel.map(s => s.m3u).join(',');
    $('xmltv').value = '';
    render();
    setStatus(allCh.length + ' channels merged from ' + sel.length + ' sources · ' + withEpg + ' with EPG');
  } catch (e) { setStatus('Merge failed: ' + e.message, 'err'); }
  finally { showLoading(false); }
});

/* ---------- loaders ---------- */
async function loadGuide() {
  const m3u = $('m3u').value.trim();
  const xmltv = $('xmltv').value.trim();
  if (!m3u) { toast('Enter an M3U playlist address first', true); return; }
  setStatus('Parsing playlist + downloading EPG…');
  showLoading(true);
  try {
    let guide = xmltv;
    const m = await post('/parse/m3u', { src: m3u });
    if (!guide && m.headerEpg) { guide = m.headerEpg; $('xmltv').value = guide; }
    if (!guide) {
      state.channels = m.channels.map((c, i) => ({ ...c, _src: i, programs: [], epg: null, matchHow: null }));
      state.groups = m.groupList;
      render();
      setStatus(m.channels.length + ' channels loaded (no EPG source auto-found). Click a channel to play.');
      return;
    }
    const match = await post('/match', { m3u, xmltv: guide });
    state.channels = match.channels.map((c, i) => ({ ...c, _src: i }));
    state.groups = match.groups;
    render();
    const withEpg = match.channels.filter(c => c.epg).length;
    setStatus(match.channels.length + ' channels · ' + match.matched + ' with EPG (' +
      match.stats.id + ' by id, ' + match.stats.name + ' by name). Click any channel to play.');
  } catch (e) {
    setStatus('Failed: ' + e.message, 'err');
    toast('Load failed: ' + e.message, true);
  } finally { showLoading(false); }
}

async function sample() {
  $('m3u').value = 'https://iptv-org.github.io/iptv/index.m3u';
  $('xmltv').value = '';

// Auto-grab: ask the server to find matching EPG guides for the current playlist.
async function autoGrab() {
  const m3u = $('m3u').value.trim();
  if (!m3u) { toast('Enter an M3U playlist first', true); return; }
  setStatus('Auto-grabbing EPG guides… (this may take a few seconds)');
  showLoading(true);
  try {
    const j = await post('/grab', { m3u });
    state.channels = j.channels.map((c, i) => ({ ...c, _src: i }));
    state.groups = j.groups;
    $('xmltv').value = ''; // clears the manual source; the grab result is in memory
    render();
    const msg = j.matched + ' of ' + j.total + ' channels matched (' +
      j.stats.id + ' by id, ' + j.stats.name + ' by name) from ' +
      j.codes.length + ' guide(s)';
    setStatus(j.failures && j.failures.length ? msg + ' · errors: ' + j.failures.join('; ') : msg);
    toast('Auto EPG: ' + msg);
  } catch (e) {
    setStatus('Auto-grab failed: ' + e.message, 'err');
    toast('Auto-grab failed: ' + e.message, true);
  } finally {
    showLoading(false);
  }
}

/* ---------- rendering ---------- */
function showLoading(on) {
  let el = document.querySelector('.loading');
  if (on) {
    if (el) return;
    el = document.createElement('div'); el.className = 'loading';
    el.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><div class="spin"></div> Loading…</div>';
    stage.appendChild(el);
  } else if (el) el.remove();
}

function buildRuler(halfHours, pxPerHour, now, width, chW) {
  let html = `<div class="ruler" style="width:${width}px">`;
  for (let h = -halfHours; h <= halfHours; h++) {
    const t = new Date(now + h * 3600e3);
    const left = chW + (h + halfHours) * pxPerHour;
    const label = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
    html += `<div class="tick" style="left:${left}px">${label}</div>`;
  }
  return html + '</div>';
}
function favKey(ch) { return ch.tvg_id || ch.name; }

function render() {
  const now = Date.now();
  const halfHours = parseInt($('window').value, 10);
  // The sticky channel column occupies the left 240px; the timeline starts to
  // its right so programs never render underneath (and are hidden by) it.
  const CH_W = 240;
  const minPxPerHour = 240;
  const availTimeline = Math.max(0, stage.clientWidth - CH_W);
  const pxPerHour = Math.max(minPxPerHour, availTimeline / (halfHours * 2));
  const totalW = CH_W + halfHours * 2 * pxPerHour;
  const start = now - halfHours * 3600e3;
  const end = now + halfHours * 3600e3;

  const selGroup = $('group').value;
  const filterMode = $('filter').value;
  const q = $('q').value.trim().toLowerCase();
  let channels = state.channels;
  if (selGroup) channels = channels.filter(c => c.group === selGroup);
  if (filterMode === 'fav') channels = channels.filter(c => state.fav.has(favKey(c)));
  if (filterMode === 'epg') channels = channels.filter(c => c.epg);
  if (q) {
    channels = channels.filter(c => c.name.toLowerCase().includes(q) ||
      (c.programs || []).some(p => p.title.toLowerCase().includes(q)));
  }

  const grp = $('group');
  grp.innerHTML = '<option value="">All channels</option>' +
    state.groups.map(g => `<option ${g===selGroup?'selected':''}>${escapeHtml(g)}</option>`).join('');

  state.view = channels;
  if (state.sel != null && state.sel >= channels.length) state.sel = channels.length - 1;

  let html = buildRuler(halfHours, pxPerHour, now, totalW, CH_W);
  html += '<div class="grid" style="width:' + totalW + 'px">';

  channels.forEach((ch, idx) => {
    const isFav = state.fav.has(favKey(ch));
    const np = nowProgram(ch, now);
    const isPlaying = state.current && state.current.url === ch.url;
    const isSel = idx === state.sel;

    html += '<div class="row' + (isPlaying ? ' playing' : '') + (isSel ? ' selected' : '') + '" id="row-' + idx + '" data-src="' + (ch._src != null ? ch._src : idx) + '">';
    html += '<div class="ch">';
    if (ch.logo) html += `<img src="${escapeHtml(ch.logo)}" loading="lazy" onerror="this.style.display='none'">`;
    html += '<div class="cinfo">';
    html += '<div class="name">' + escapeHtml(ch.name) + '</div>';
    if (np) html += `<div class="nowprog"><span class="t">${fmtTime(np.start)}–${fmtTime(np.stop)}</span> ${escapeHtml(np.title)}</div>`;
    else if (ch.epg) html += '<div class="nowprog" style="color:var(--muted)">no program at this time</div>';
    else html += '<div class="nowprog" style="color:var(--muted)">no EPG info</div>';
    if (ch.group) html += `<div class="group">${escapeHtml(ch.group)}</div>`;
    html += '</div>';
    html += `<button class="star ${isFav?'on':''}" data-idx="${idx}" title="Favorite">★</button>`;
    html += '</div>'; // ch

    const progs = (ch.programs || []).filter(p => p.stop > start && p.start < end);
    if (progs.length === 0) {
      const CH_W = 240; // sticky channel column width; start fallback to its right
      html += `<div class="prog noinfo" style="left:${CH_W}px;width:${totalW - CH_W}px">${ch.epg ? 'No program in this window' : 'No EPG data — click the channel to play anyway'}</div>`;
    }
    for (const p of progs) {
      const left = CH_W + Math.max(0, (p.start - start) / 3600e3) * pxPerHour;
      const right = Math.min(totalW, CH_W + (p.stop - start) / 3600e3) * pxPerHour;
      const w = right - left;
      if (w < 6) continue;
      const isNow = p.start <= now && p.stop > now;
      const tl = `${fmtTime(p.start)}–${fmtTime(p.stop)}`;
      html += `<div class="prog ${isNow?'now':''}" style="left:${left}px;width:${w}px" ` +
        `data-idx="${idx}" data-tt="${escapeHtml(p.title)}" data-desc="${escapeHtml(p.desc||'')}" data-cat="${escapeHtml(p.cat||'')}" data-icon="${escapeHtml(p.icon||'')}" data-start="${p.start}" data-stop="${p.stop}">` +
        `<div class="t">${tl}</div>` +
        `<div class="tt">${escapeHtml(p.title)}</div>` +
        (p.cat ? `<div class="d">${escapeHtml(p.cat)}</div>` : '') +
        '</div>';
    }
    html += '</div>'; // row
  });

  // now-line must live inside the grid so it spans the full content height
  const nowLeft = CH_W + halfHours * pxPerHour;
  html += `<div class="nowline" style="left:${nowLeft}px"></div>`;
  html += '</div>'; // grid

  stage.innerHTML = html;
  stage.scrollLeft = Math.max(0, nowLeft - stage.clientWidth / 2);

  // click channel row -> show channel details (unless clicking star)
  stage.querySelectorAll('.row').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.star')) return;
      const idx = parseInt(row.id.split('-')[1], 10);
      const ch = channels[idx];
      if (!ch) return;
      selectAt(idx);
      showChannelDetails(ch);
    });
  });

  // click program -> details panel
  stage.querySelectorAll('.prog:not(.noinfo)').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.idx, 10);
      const ch = channels[idx];
      const full = (ch.programs || []).find(p => p.start === parseInt(el.dataset.start,10) && p.stop === parseInt(el.dataset.stop,10));
      showDetails(ch, full || {
        title: el.dataset.tt, desc: el.dataset.desc, cat: el.dataset.cat,
        icon: el.dataset.icon || '', start: parseInt(el.dataset.start,10), stop: parseInt(el.dataset.stop,10)
      });
    });
  });

  stage.querySelectorAll('.star').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const ch = channels[parseInt(el.dataset.idx,10)];
      if (!ch) return;
      const k = favKey(ch);
      if (state.fav.has(k)) state.fav.delete(k); else state.fav.add(k);
      saveFav(); render();
      toast(state.fav.has(k) ? '★ Added to favorites' : 'Removed from favorites');
    });
  });

  clearInterval(timer);
  timer = setInterval(() => {
    const nl = stage.querySelector('.nowline');
    if (nl) nl.style.left = ($('window').value * 240) + 'px';
  }, 60000);
}

// Parse xmltv_ns episode-num ("S.E" or "S.E/P") into {season, episode}.
function parseEpisode(program) {
  if (!program || !Array.isArray(program.episodeNums)) return null;
  const ns = program.episodeNums.find(e => e.system === 'xmltv_ns');
  if (ns) {
    const m = ns.num.trim().match(/^\s*(\d+)\.(\d+)/);
    if (m) return { season: +m[1], episode: +m[2] };
  }
  const on = program.episodeNums.find(e => e.system === 'onscreen');
  if (on && /^\d+$/.test(on.num.trim())) return { season: null, episode: +on.num.trim() };
  return null;
}

// Build the metadata rows for the drawer (only fields that are present).
function renderMeta(program, channel) {
  const rows = [];
  const push = (k, v) => { if (v != null && String(v).trim() !== '' && String(v).trim() !== '0') rows.push([k, String(v)]); };
  if (program) {
    const ep = parseEpisode(program);
    if (program.sub) push('Episode', program.sub);
    if (ep && ep.season != null) push('Season', ep.season);
    if (ep && ep.episode != null) push('Episode №', ep.episode);
    if (program.year) push('Year', fmtYear(program.year));
    if (program.start) push('Date', fmtDate(program.start));
    if (program.rating) push('Rating', program.rating);
    if (program.lang) push('Language', program.lang.toUpperCase());
    const creds = []; if (program.directors && program.directors.length) creds.push('Dir: ' + program.directors.join(', '));
    if (program.actors && program.actors.length) creds.push('Cast: ' + program.actors.join(', '));
    if (creds.length) push('Director & Cast', creds.join(' · '));
    if (program.audio && program.audio.length) push('Audio', program.audio.join(', '));
    if (program.cat) push('Genre', program.cat);
  } else if (channel && channel.group) {
    push('Group', channel.group);
  }
  if (!rows.length) { $('dMeta').innerHTML = ''; return; }
  $('dMeta').innerHTML = rows.map(([k, v]) =>
    `<span class="dm-k">${escapeHtml(k)}</span><span class="dm-v">${escapeHtml(v)}</span>`).join('');
}

// Show an image card in the drawer when a usable (http/https) icon exists.
function setDrawerIcon(url) {
  const wrap = $('dIcon'), img = $('dIconImg');
  const usable = url && /^https?:\/\//i.test(url);
  img.classList.add('hidden');
  if (usable) {
    img.onerror = () => { wrap.style.display = 'none'; };
    img.onload = () => { wrap.style.display = 'block'; img.classList.remove('hidden'); };
    img.src = url;
  } else {
    img.onerror = null; img.onload = null; img.removeAttribute('src');
    wrap.style.display = 'none';
  }
}

function showDetails(ch, p) {
  $('dTitle').textContent = p.title || ch.name;
  $('dSub').textContent = ch.name + (p.cat ? ' · ' + p.cat : '');
  $('dTime').textContent = (p.start && p.stop) ? (fmtTime(p.start) + ' – ' + fmtTime(p.stop)) : '';
  $('dDesc').textContent = p.desc || 'No synopsis available.';
  $('dList').innerHTML = '';
  setDrawerIcon((p.icon && p.icon.trim()) || (ch.logo && ch.logo.trim()));
  renderMeta(p, ch);
  $('dPlay').onclick = () => { playChannel(ch); };
  openDetails();
}

// Clicking a channel opens the bottom drawer: channel info, now program, upcoming list.
function showChannelDetails(ch) {
  const np = nowProgram(ch, Date.now());
  $('dTitle').textContent = ch.name;
  $('dSub').textContent = (ch.group ? ch.group : '') + (ch.epg ? ' · has EPG' : ' · no EPG');
  $('dTime').textContent = np ? ('Now: ' + np.title + '  ' + fmtTime(np.start) + '–' + fmtTime(np.stop)) : '';
  $('dDesc').textContent = np ? (np.desc || '') : 'No program information available for this channel.';
  setDrawerIcon((np && np.icon && np.icon.trim()) || (ch.logo && ch.logo.trim()));
  renderMeta(np, ch);
  // upcoming program list
  const now = Date.now();
  const upcoming = (ch.programs || []).filter(p => p.stop > now).slice(0, 10);
  if (upcoming.length) {
    $('dList').innerHTML = '<div class="dl-head">Upcoming</div>' + upcoming.map(p =>
      `<div class="dl-item" data-start="${p.start}" data-stop="${p.stop}" ` +
      `data-tt="${escapeHtml(p.title)}" data-desc="${escapeHtml(p.desc||'')}" ` +
      `data-cat="${escapeHtml(p.cat||'')}"><span class="dl-time">${fmtDateTime(p.start)}</span> ${escapeHtml(p.title)}</div>`).join('');
    $('dList').querySelectorAll('.dl-item').forEach(it => {
      it.addEventListener('click', () => {
        showDetails(ch, { title: it.dataset.tt, desc: it.dataset.desc, cat: it.dataset.cat,
          start: +it.dataset.start, stop: +it.dataset.stop });
      });
    });
  } else {
    $('dList').innerHTML = '';
  }
  $('dPlay').onclick = () => { playChannel(ch); };
  openDetails();
}

// Horizontal wheel-scroll over the timeline (scroll rows left/right).
stage.addEventListener('wheel', (e) => {
  // Only intercept when there's horizontal overflow and the pointer is over the
  // program area (right of the sticky channel column).
  if (stage.scrollWidth <= stage.clientWidth) return;
  const r = stage.getBoundingClientRect();
  if (e.clientX - r.left < 240) return; // over the channel column -> keep vertical
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    stage.scrollLeft += e.deltaY;
  }
}, { passive: false });

// ---- Remote / keyboard navigation (TV-style) ----
function rowHeight() { return document.body.classList.contains('tv') ? 96 : 72; }
function rulerHeight() { return document.body.classList.contains('tv') ? 42 : 34; }
function drawerHeight() {
  const d = $('details');
  return d.classList.contains('open') ? d.offsetHeight : 0;
}
function selectAt(idx) {
  if (!state.view.length) return;
  if (idx < 0) idx = 0;
  if (idx >= state.view.length) idx = state.view.length - 1;
  state.sel = idx;
  // Move only the highlight class — avoid re-rendering the whole grid.
  document.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
  const row = document.getElementById('row-' + idx);
  if (row) {
    row.classList.add('selected');
    // Vertically scroll via arithmetic (uniform row height) — no DOM layout reads.
    // Reserve the open drawer's height so the selected channel stays visible
    // above the description panel. Rows begin below the ruler, so add its height.
    const h = rowHeight();
    const top = rulerHeight() + idx * h;
    const vh = Math.max(0, stage.clientHeight - drawerHeight());
    if (top < stage.scrollTop) stage.scrollTop = top - 8;
    else if (top + h > stage.scrollTop + vh) stage.scrollTop = top + h - vh + 8;
  }
}
function selChannel() { return state.sel != null ? state.view[state.sel] : null; }
window.addEventListener('keydown', (e) => {
// ignore when typing in an input/select/textarea
const t = e.target;
if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
if (!state.view.length) return;
switch (e.key) {
  case 'ArrowDown': e.preventDefault(); selectAt((state.sel == null ? -1 : state.sel) + 1); break;
  case 'ArrowUp':   e.preventDefault(); selectAt((state.sel == null ? 1 : state.sel) - 1); break;
  case 'ArrowRight': e.preventDefault(); stage.scrollLeft += 140; break;
  case 'ArrowLeft':  e.preventDefault(); stage.scrollLeft -= 140; break;
  case 'Enter': {
    const ch = selChannel(); if (ch) { e.preventDefault(); playChannel(ch); } break;
  }
  case ' ': {
    const ch = selChannel(); if (ch) { e.preventDefault(); playChannel(ch); } break;
  }
}
});
// Re-render on resize so the timeline keeps filling the full width.
(() => {
  let t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => { if (state.channels.length) render(); }, 150);
  });
})();

/* ---------- jump-to-channel autocomplete ---------- */
(function setupJump() {
  const input = document.getElementById('chJump');
  const box = document.getElementById('chJumpResults');
  if (!input || !box) return;

  const LIMIT = 60;
  let active = -1;
  let matches = [];

  function close() { box.classList.remove('open'); box.innerHTML = ''; active = -1; }

  function renderResults() {
    if (!matches.length) {
      box.innerHTML = '<div class="jr-none">no channel matches</div>';
    } else {
      box.innerHTML = matches.map((m, i) =>
        `<div class="jr ${i===active?'active':''}" data-i="${i}">${escapeHtml(m.name)}` +
        (m.group ? `<span class="g">${escapeHtml(m.group)}</span>` : '') + '</div>').join('');
    }
    box.classList.add('open');
  }

  function jumpTo(m) {
    close();
    input.value = '';
    // clear filters so the channel is visible, then scroll
    $('group').value = ''; $('filter').value = 'all'; $('q').value = '';
    render();
    const el = document.querySelector(`.row[data-src="${m._src}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { close(); return; }
    matches = state.channels.filter(c => c.name.toLowerCase().includes(q)).slice(0, LIMIT);
    active = -1;
    renderResults();
  });

  input.addEventListener('keydown', (e) => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, matches.length - 1); renderResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); renderResults(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (matches[active]) jumpTo(matches[active]); else if (matches[0]) jumpTo(matches[0]); }
    else if (e.key === 'Escape') { close(); }
  });

  box.addEventListener('mousedown', (e) => {
    const it = e.target.closest('.jr');
    if (it) jumpTo(matches[parseInt(it.dataset.i, 10)]);
  });

  input.addEventListener('blur', () => setTimeout(close, 120));
})();
