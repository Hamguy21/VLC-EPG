<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLC EPG — TV Guide</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161a21; --panel2:#1d222b; --border:#2a313d;
    --text:#e6e9ef; --muted:#8b93a3; --accent:#5673f5; --accent2:#6b8aff;
    --now:#ff4d5e; --grid:#232a35; --star:#f5c542;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100vh; }

  /* header */
  .top { display:flex; align-items:center; gap:10px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .top h1 { font-size:16px; margin:0 8px 0 0; font-weight:650; letter-spacing:.2px; }
  .top h1 .sub { font-size:11px; color:var(--muted); font-weight:500; margin-left:6px; }
  .field { display:flex; flex-direction:column; gap:2px; }
  .field label { font-size:10px; text-transform:uppercase; color:var(--muted); letter-spacing:.6px; }
  .field input, .field select { background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:6px; font-size:13px; }
  .field input:focus, .field select:focus { outline:none; border-color:var(--accent); }
  .field input { width:300px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:8px 14px;
    border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--accent2); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.small { padding:4px 9px; font-size:11.5px; }
  .status { margin-left:auto; color:var(--muted); font-size:12px; max-width:320px; }
  .status.ok { color:#5fd48a; }
  .status.err { color:var(--now); }

  /* toolbar */
  .bar { display:flex; align-items:center; gap:10px; padding:6px 16px;
    background:var(--panel2); border-bottom:1px solid var(--border); font-size:12px; flex-wrap:wrap; }
  .bar .grp { color:var(--muted); margin-right:4px; }
  .bar select, .bar input { background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:4px 8px; font-size:12px; }
  .bar input[type=text] { width:190px; }
  .bar .hint { color:var(--muted); margin-left:auto; }

  /* jump-to-channel autocomplete */
  .jumpwrap { position:relative; }
  .jumpwrap input { width:200px; }
  .jump-results { position:absolute; top:100%; left:0; margin-top:2px; min-width:240px;
    max-height:320px; overflow:auto; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; z-index:70; box-shadow:0 8px 24px rgba(0,0,0,.5); display:none; }
  .jump-results.open { display:block; }
  .jump-results .jr { padding:7px 10px; cursor:pointer; font-size:12.5px;
    border-bottom:1px solid var(--grid); }
  .jump-results .jr:hover, .jump-results .jr.active { background:var(--accent); color:#fff; }
  .jump-results .jr .g { font-size:10px; color:var(--muted); margin-left:6px; }
  .jump-results .jr:hover .g { color:#dde3ff; }
  .jump-results .jr-none { padding:8px 10px; color:var(--muted); font-size:12px; }

  /* now playing bar */
  .nowbar { display:flex; align-items:center; gap:10px; padding:6px 16px;
    background:linear-gradient(90deg, #1a2030, #202738); border-bottom:1px solid var(--border);
    font-size:13px; }
  .nowbar .pulse { width:10px; height:10px; border-radius:50%; background:var(--now);
    box-shadow:0 0 0 0 rgba(255,77,94,.6); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,77,94,.6)} 70%{box-shadow:0 0 0 8px rgba(255,77,94,0)} 100%{box-shadow:0 0 0 0 rgba(255,77,94,0)} }
  .nowbar .nb-ch { font-weight:650; }
  .nowbar .nb-prog { color:var(--text); }
  .nowbar .nb-time { color:var(--muted); margin-left:auto; }

  /* grid stage */
  .stage { flex:1; overflow:auto; position:relative; background:var(--bg); }
  .grid { position:relative; }

  .ruler { position:sticky; top:0; z-index:20; height:34px; background:var(--panel);
    border-bottom:1px solid var(--border); }
  .ruler .tick { position:absolute; top:0; bottom:0; border-left:1px solid var(--grid);
    font-size:10px; color:var(--muted); padding:2px 4px; white-space:nowrap; }

  .row { position:relative; height:72px; border-bottom:1px solid var(--grid); cursor:pointer; }
  .row:hover { background:rgba(86,115,245,.06); }
  .row.playing { box-shadow:inset 3px 0 0 var(--accent); }
  .row .ch { position:sticky; left:0; z-index:10; width:240px; height:72px;
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; align-items:center; gap:8px; padding:6px 8px; }
  .row .ch img { width:30px; height:30px; object-fit:contain; border-radius:6px; background:#000; }
  .row .ch .cinfo { min-width:0; flex:1; }
  .row .ch .name { font-size:12.5px; font-weight:600; line-height:1.15;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .row .ch .nowprog { font-size:10.5px; color:var(--accent2); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .row .ch .nowprog .t { color:var(--muted); }
  .row .ch .group { font-size:9.5px; color:var(--muted); }
  .row .ch .star { cursor:pointer; font-size:18px; color:var(--muted); user-select:none;
    background:none; border:none; padding:0 2px; line-height:1; }
  .row .ch .star.on { color:var(--star); }

  .prog { position:absolute; top:4px; bottom:4px; background:var(--panel2);
    border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:5px; padding:4px 8px; overflow:hidden; cursor:pointer;
    transition:background .12s, border-color .12s; }
  .prog:hover { background:#262d3a; border-color:var(--accent2); }
  .prog.now { border-left-color:var(--now); }
  .prog .t { font-size:10px; color:var(--muted); }
  .prog .tt { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .prog .d { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .prog.noinfo { border-style:dashed; border-left:3px dashed var(--muted);
    background:transparent; color:var(--muted); display:flex; align-items:center;
    justify-content:center; text-align:center; font-size:11px; padding:4px 12px;
    white-space:normal; overflow:visible; }

  .nowline { position:absolute; top:0; bottom:0; width:2px; background:var(--now);
    z-index:5; pointer-events:none; }
  .nowline::after { content:""; position:absolute; top:0; left:-4px;
    border:5px solid transparent; border-top:7px solid var(--now); }

  .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:70%; color:var(--muted); gap:8px; }
  .placeholder .big { font-size:18px; }

  .loading { position:absolute; inset:0; background:rgba(15,17,21,.7); display:flex;
    align-items:center; justify-content:center; font-size:15px; z-index:50; }
  .spin { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* details panel */
  .details { position:absolute; right:16px; bottom:16px; width:340px; max-width:80%;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .details .d-title { font-size:15px; font-weight:650; margin-bottom:2px; }
  .details .d-sub { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .details .d-time { font-size:12px; color:var(--accent2); margin-bottom:6px; }
  .details .d-desc { font-size:12.5px; color:var(--text); max-height:120px; overflow:auto; }
  .details .d-row { display:flex; gap:8px; margin-top:10px; }
  .details .d-row .btn { flex:1; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#222a38; border:1px solid var(--border); padding:10px 18px; border-radius:8px;
    font-size:13px; z-index:100; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>▦ VLC EPG<span class="sub">TV guide</span></h1>
    <div class="field"><label>M3U playlist</label>
      <input id="m3u" placeholder="https://iptv-org.github.io/iptv/index.m3u"></div>
    <div class="field"><label>XMLTV EPG</label>
      <input id="xmltv" placeholder="https://…/epg.xml (empty → auto-find in playlist header)"></div>
    <button class="btn" id="load">Load guide</button>
    <button class="btn ghost" id="sample">Sample</button>
    <button class="btn ghost" id="saveSrc" title="Save the current playlist/EPG as a named source">+ Save</button>
    <div class="field"><label>Saved sources</label>
      <select id="saved"><option value="">— none —</option></select></div>
    <button class="btn ghost small" id="loadSaved" title="Load selected source">Load</button>
    <button class="btn ghost small" id="delSaved" title="Delete selected source">Delete</button>
    <button class="btn ghost small" id="editSaved" title="Edit selected source name">Rename</button>
    <div class="status" id="status">Enter a playlist + EPG, or load the sample.</div>
  </div>

  <div class="nowbar" id="nowbar" style="display:none">
    <span class="pulse"></span>
    <span class="nb-ch" id="nbCh"></span>
    <span class="nb-prog" id="nbProg">▶</span>
    <span class="nb-time" id="nbTime"></span>
  </div>

  <div class="bar">
    <span class="grp">Group:</span><select id="group"><option value="">All channels</option></select>
    <span class="grp">Filter:</span>
    <select id="filter">
      <option value="all" selected>All</option>
      <option value="fav">Favorites</option>
      <option value="epg">With EPG</option>
    </select>
    <span class="grp">Search:</span><input type="text" id="q" placeholder="channel or program…">
    <span class="grp">Window:</span>
    <select id="window">
      <option value="2">±2 h</option><option value="3" selected>±3 h</option>
      <option value="6">±6 h</option><option value="12">±12 h</option>
    </select>
    <span class="grp">Channel:</span>
    <span class="jumpwrap">
      <input type="text" id="chJump" placeholder="Jump to channel…" autocomplete="off">
      <div class="jump-results" id="chJumpResults"></div>
    </span>
    <span class="hint">click a channel or program to watch · ★ = favorite</span>
  </div>

  <div class="stage" id="stage">
    <div class="placeholder"><div class="big">📺</div>
      <div>EPG grid appears here</div></div>
  </div>
</div>

<div class="details" id="details" style="display:none">
  <div class="d-title" id="dTitle"></div>
  <div class="d-sub" id="dSub"></div>
  <div class="d-time" id="dTime"></div>
  <div class="d-desc" id="dDesc"></div>
  <div class="d-row">
    <button class="btn" id="dPlay">▶ Play</button>
    <button class="btn ghost" id="dClose">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
const state = { channels: [], groups: [], now: Date.now(), fav: new Set(), current: null };
let timer = null;
const LS_SOURCES = 'vlcEpgSources';
const LS_FAV = 'vlcEpgFavorites';

function loadFav() { try { state.fav = new Set(JSON.parse(localStorage.getItem(LS_FAV) || '[]')); } catch (_) {} }
function saveFav() { localStorage.setItem(LS_FAV, JSON.stringify([...state.fav])); }

function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.background = isErr ? '#3a2226' : '#222a38';
  setTimeout(() => t.classList.remove('show'), 3200);
}
async function post(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function setStatus(text, kind) {
  const s = $('status'); s.textContent = text; s.className = 'status ' + (kind || '');
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function nowProgram(ch, at) {
  for (const p of (ch.programs || [])) {
    if (p.start <= at && p.stop > at) return p;
    if (p.start > at) break;
  }
  return null;
}

/* ---------- sources (add / load / rename / delete) ---------- */
function savedSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || '[]'); } catch (_) { return []; } }
function writeSources(list) { localStorage.setItem(LS_SOURCES, JSON.stringify(list)); }
function selectedSource() {
  const name = $('saved').value;
  return savedSources().find(s => s.name === name) || null;
}
function refreshSavedDropdown(selectedName) {
  const dd = $('saved'); const list = savedSources();
  dd.innerHTML = '<option value="">— none —</option>' + list.map(s =>
    `<option ${s.name === selectedName ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
}
// Save current playlist/EPG as a named source (add or overwrite)
$('saveSrc').addEventListener('click', () => {
  const m3u = $('m3u').value.trim();
  const xmltv = $('xmltv').value.trim();
  if (!m3u) { toast('Enter a playlist first', true); return; }
  let name = prompt('Name this saved source:', '');
  if (!name) return;
  name = name.trim();
  if (!name) return;
  const list = savedSources();
  const existing = list.findIndex(s => s.name === name);
  if (existing >= 0) {
    if (!confirm('A source named "' + name + '" already exists. Overwrite it?')) return;
    list[existing] = { name, m3u, xmltv };
  } else {
    list.push({ name, m3u, xmltv });
  }
  writeSources(list);
  refreshSavedDropdown(name);
  toast('Saved: ' + name);
});
// Load the selected source into the inputs and fetch it
$('loadSaved').addEventListener('click', () => {
  const s = selectedSource();
  if (!s) { toast('Select a saved source first', true); return; }
  $('m3u').value = s.m3u;
  $('xmltv').value = s.xmltv || '';
  loadGuide();
});
// Delete the selected source
$('delSaved').addEventListener('click', () => {
  const s = selectedSource();
  if (!s) { toast('Select a saved source first', true); return; }
  if (!confirm('Delete source "' + s.name + '"?')) return;
  writeSources(savedSources().filter(x => x.name !== s.name));
  refreshSavedDropdown('');
  toast('Deleted: ' + s.name);
});
// Rename the selected source
$('editSaved').addEventListener('click', () => {
  const s = selectedSource();
  if (!s) { toast('Select a saved source first', true); return; }
  const name = prompt('New name for "' + s.name + '":', s.name);
  if (!name) return;
  const nn = name.trim();
  if (!nn) return;
  const list = savedSources().filter(x => x.name !== s.name);
  list.push({ name: nn, m3u: s.m3u, xmltv: s.xmltv });
  writeSources(list);
  refreshSavedDropdown(nn);
  toast('Renamed: ' + nn);
});

/* ---------- loaders ---------- */
async function loadGuide() {
  const m3u = $('m3u').value.trim();
  const xmltv = $('xmltv').value.trim();
  if (!m3u) { toast('Enter an M3U playlist address first', true); return; }
  setStatus('Parsing playlist + downloading EPG…');
  showLoading(true);
  try {
    let guide = xmltv;
    const m = await post('/parse/m3u', { src: m3u });
    if (!guide && m.headerEpg) { guide = m.headerEpg; $('xmltv').value = guide; }
    if (!guide) {
      state.channels = m.channels.map((c, i) => ({ ...c, _src: i, programs: [], epg: null, matchHow: null }));
      state.groups = m.groupList;
      render();
      setStatus(m.channels.length + ' channels loaded (no EPG source auto-found). Click a channel to play.');
      return;
    }
    const match = await post('/match', { m3u, xmltv: guide });
    state.channels = match.channels.map((c, i) => ({ ...c, _src: i }));
    state.groups = match.groups;
    render();
    const withEpg = match.channels.filter(c => c.epg).length;
    setStatus(match.channels.length + ' channels · ' + match.matched + ' with EPG (' +
      match.stats.id + ' by id, ' + match.stats.name + ' by name). Click any channel to play.');
  } catch (e) {
    setStatus('Failed: ' + e.message, 'err');
    toast('Load failed: ' + e.message, true);
  } finally { showLoading(false); }
}

async function sample() {
  $('m3u').value = 'https://iptv-org.github.io/iptv/index.m3u';
  $('xmltv').value = '';
  await loadGuide();
}

/* ---------- rendering ---------- */
function showLoading(on) {
  let el = document.querySelector('.loading');
  if (on) {
    if (el) return;
    el = document.createElement('div'); el.className = 'loading';
    el.innerHTML = '<div style="display:flex;gap:10px;align-items:center"><div class="spin"></div> Loading…</div>';
    stage.appendChild(el);
  } else if (el) el.remove();
}

function buildRuler(halfHours, pxPerHour, now) {
  let html = '<div class="ruler">';
  for (let h = -halfHours; h <= halfHours; h++) {
    const t = new Date(now + h * 3600e3);
    const left = (h + halfHours) * pxPerHour;
    const label = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');
    html += `<div class="tick" style="left:${left}px">${label}</div>`;
  }
  return html + '</div>';
}
function favKey(ch) { return ch.tvg_id || ch.name; }

function render() {
  const now = Date.now();
  const halfHours = parseInt($('window').value, 10);
  const pxPerHour = 240;
  const totalW = halfHours * 2 * pxPerHour;
  const start = now - halfHours * 3600e3;
  const end = now + halfHours * 3600e3;

  const selGroup = $('group').value;
  const filterMode = $('filter').value;
  const q = $('q').value.trim().toLowerCase();
  let channels = state.channels;
  if (selGroup) channels = channels.filter(c => c.group === selGroup);
  if (filterMode === 'fav') channels = channels.filter(c => state.fav.has(favKey(c)));
  if (filterMode === 'epg') channels = channels.filter(c => c.epg);
  if (q) {
    channels = channels.filter(c => c.name.toLowerCase().includes(q) ||
      (c.programs || []).some(p => p.title.toLowerCase().includes(q)));
  }

  const grp = $('group');
  grp.innerHTML = '<option value="">All channels</option>' +
    state.groups.map(g => `<option ${g===selGroup?'selected':''}>${escapeHtml(g)}</option>`).join('');

  let html = buildRuler(halfHours, pxPerHour, now);
  html += '<div class="grid" style="width:' + totalW + 'px">';

  channels.forEach((ch, idx) => {
    const isFav = state.fav.has(favKey(ch));
    const np = nowProgram(ch, now);
    const isPlaying = state.current && state.current.url === ch.url;

    html += '<div class="row' + (isPlaying ? ' playing' : '') + '" id="row-' + idx + '" data-src="' + (ch._src != null ? ch._src : idx) + '">';
    html += '<div class="ch">';
    if (ch.logo) html += `<img src="${escapeHtml(ch.logo)}" loading="lazy" onerror="this.style.display='none'">`;
    html += '<div class="cinfo">';
    html += '<div class="name">' + escapeHtml(ch.name) + '</div>';
    if (np) html += `<div class="nowprog"><span class="t">${fmtTime(np.start)}–${fmtTime(np.stop)}</span> ${escapeHtml(np.title)}</div>`;
    else if (ch.epg) html += '<div class="nowprog" style="color:var(--muted)">no program at this time</div>';
    else html += '<div class="nowprog" style="color:var(--muted)">no EPG info</div>';
    if (ch.group) html += `<div class="group">${escapeHtml(ch.group)}</div>`;
    html += '</div>';
    html += `<button class="star ${isFav?'on':''}" data-idx="${idx}" title="Favorite">★</button>`;
    html += '</div>'; // ch

    const progs = (ch.programs || []).filter(p => p.stop > start && p.start < end);
    if (progs.length === 0) {
      const CH_W = 240; // sticky channel column width; start fallback to its right
      html += `<div class="prog noinfo" style="left:${CH_W}px;width:${totalW - CH_W}px">${ch.epg ? 'No program in this window' : 'No EPG data — click the channel to play anyway'}</div>`;
    }
    for (const p of progs) {
      const left = Math.max(0, (p.start - start) / 3600e3) * pxPerHour;
      const right = Math.min(totalW, (p.stop - start) / 3600e3) * pxPerHour;
      const w = right - left;
      if (w < 6) continue;
      const isNow = p.start <= now && p.stop > now;
      const tl = `${fmtTime(p.start)}–${fmtTime(p.stop)}`;
      html += `<div class="prog ${isNow?'now':''}" style="left:${left}px;width:${w}px" ` +
        `data-idx="${idx}" data-tt="${escapeHtml(p.title)}" data-desc="${escapeHtml(p.desc||'')}" data-cat="${escapeHtml(p.cat||'')}" data-start="${p.start}" data-stop="${p.stop}">` +
        `<div class="t">${tl}</div>` +
        `<div class="tt">${escapeHtml(p.title)}</div>` +
        (p.cat ? `<div class="d">${escapeHtml(p.cat)}</div>` : '') +
        '</div>';
    }
    html += '</div>'; // row
  });
  html += '</div>';

  const nowLeft = halfHours * pxPerHour;
  html += `<div class="nowline" style="left:${nowLeft}px"></div>`;
  stage.innerHTML = html;
  stage.scrollLeft = Math.max(0, nowLeft - stage.clientWidth / 2);

  // click channel row -> play (unless clicking star)
  stage.querySelectorAll('.row').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.star')) return;
      const idx = parseInt(row.id.split('-')[1], 10);
      const ch = channels[idx];
      if (!ch) return;
      playChannel(ch);
    });
  });

  // click program -> details panel
  stage.querySelectorAll('.prog:not(.noinfo)').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.idx, 10);
      const ch = channels[idx];
      showDetails(ch, {
        title: el.dataset.tt, desc: el.dataset.desc, cat: el.dataset.cat,
        start: parseInt(el.dataset.start,10), stop: parseInt(el.dataset.stop,10)
      });
    });
  });

  stage.querySelectorAll('.star').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const ch = channels[parseInt(el.dataset.idx,10)];
      if (!ch) return;
      const k = favKey(ch);
      if (state.fav.has(k)) state.fav.delete(k); else state.fav.add(k);
      saveFav(); render();
      toast(state.fav.has(k) ? '★ Added to favorites' : 'Removed from favorites');
    });
  });

  clearInterval(timer);
  timer = setInterval(() => {
    const nl = stage.querySelector('.nowline');
    if (nl) nl.style.left = ($('window').value * 240) + 'px';
  }, 60000);
}

/* ---------- play + details ---------- */
function playChannel(ch) {
  if (!ch || !ch.url) { toast('No stream URL for this channel', true); return; }
  state.current = { url: ch.url, name: ch.name };
  render();
  Promise.resolve(post('/play', { url: ch.url }))
    .then(() => {
      updateNowBar(ch);
      toast('▶ ' + ch.name);
    })
    .catch(e => toast('Play failed: ' + e.message, true));
}

function updateNowBar(ch) {
  const bar = $('nowbar');
  bar.style.display = 'flex';
  $('nbCh').textContent = ch.name;
  const np = nowProgram(ch, Date.now());
  $('nbProg').textContent = np ? ('Now: ' + np.title) : '▶ playing';
  $('nbTime').textContent = np ? (fmtTime(np.start) + '–' + fmtTime(np.stop)) : '';
}

function showDetails(ch, p) {
  const d = $('details');
  $('dTitle').textContent = p.title || ch.name;
  $('dSub').textContent = ch.name + (p.cat ? ' · ' + p.cat : '');
  $('dTime').textContent = (p.start && p.stop) ? (fmtTime(p.start) + ' – ' + fmtTime(p.stop)) : '';
  $('dDesc').textContent = p.desc || 'No synopsis available.';
  d.style.display = 'block';
  $('dPlay').onclick = () => { d.style.display='none'; playChannel(ch); };
  $('dClose').onclick = () => { d.style.display = 'none'; };
}

/* events */
$('load').addEventListener('click', loadGuide);
$('sample').addEventListener('click', sample);
$('group').addEventListener('change', () => { if (state.channels.length) render(); });
$('filter').addEventListener('change', () => { if (state.channels.length) render(); });
$('q').addEventListener('input', () => { if (state.channels.length) render(); });
$('window').addEventListener('change', () => { if (state.channels.length) render(); });
$('m3u').addEventListener('keydown', e => { if (e.key === 'Enter') loadGuide(); });
$('xmltv').addEventListener('keydown', e => { if (e.key === 'Enter') loadGuide(); });

/* ---------- jump-to-channel autocomplete ---------- */
(function setupJump() {
  const input = document.getElementById('chJump');
  const box = document.getElementById('chJumpResults');
  if (!input || !box) return;

  const LIMIT = 60;
  let active = -1;
  let matches = [];

  function close() { box.classList.remove('open'); box.innerHTML = ''; active = -1; }

  function renderResults() {
    if (!matches.length) {
      box.innerHTML = '<div class="jr-none">no channel matches</div>';
    } else {
      box.innerHTML = matches.map((m, i) =>
        `<div class="jr ${i===active?'active':''}" data-i="${i}">${escapeHtml(m.name)}` +
        (m.group ? `<span class="g">${escapeHtml(m.group)}</span>` : '') + '</div>').join('');
    }
    box.classList.add('open');
  }

  function jumpTo(m) {
    close();
    input.value = '';
    // clear filters so the channel is visible, then scroll
    $('group').value = ''; $('filter').value = 'all'; $('q').value = '';
    render();
    const el = document.querySelector(`.row[data-src="${m._src}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { close(); return; }
    matches = state.channels.filter(c => c.name.toLowerCase().includes(q)).slice(0, LIMIT);
    active = -1;
    renderResults();
  });

  input.addEventListener('keydown', (e) => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, matches.length - 1); renderResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); renderResults(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (matches[active]) jumpTo(matches[active]); else if (matches[0]) jumpTo(matches[0]); }
    else if (e.key === 'Escape') { close(); }
  });

  box.addEventListener('mousedown', (e) => {
    const it = e.target.closest('.jr');
    if (it) jumpTo(matches[parseInt(it.dataset.i, 10)]);
  });

  input.addEventListener('blur', () => setTimeout(close, 120));
})();

loadFav();
refreshSavedDropdown('');
</script>
